name: CD

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag / git tag to deploy'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write  # For OIDC-based AWS/EKS auth
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Determine image tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "image_tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Strip the leading 'v' from the git tag (v1.2.3 → 1.2.3)
            echo "image_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # ── Configure AWS credentials (OIDC, no long-lived keys) ────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # ── Update kubeconfig for EKS ────────────────────────────────────────────
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ vars.EKS_CLUSTER_NAME }} \
            --region ${{ vars.AWS_REGION || 'us-east-1' }}

      # ── Apply kustomize prod overlay ─────────────────────────────────────────
      - name: Kustomize set image tags
        run: |
          cd k8s/overlays/prod
          IMAGE_TAG=${{ steps.tag.outputs.image_tag }}
          ACCOUNT_ID=${{ vars.AWS_ACCOUNT_ID }}
          REGION=${{ vars.AWS_REGION || 'us-east-1' }}
          ECR_PREFIX="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"

          kustomize edit set image \
            order-service=${ECR_PREFIX}/order-service:${IMAGE_TAG} \
            bff=${ECR_PREFIX}/bff:${IMAGE_TAG} \
            inventory-service=${ECR_PREFIX}/inventory-service:${IMAGE_TAG} \
            notification-service=${ECR_PREFIX}/notification-service:${IMAGE_TAG} \
            frontend=${ECR_PREFIX}/frontend:${IMAGE_TAG}

      - name: Deploy prod overlay
        run: kubectl apply -k k8s/overlays/prod

      - name: Wait for rollout
        run: |
          for deploy in order-service bff inventory-service notification-service frontend; do
            kubectl rollout status deployment/$deploy -n poc --timeout=300s
          done

      # ── ArgoCD sync (optional GitOps path) ──────────────────────────────────
      # Uncomment when ArgoCD is installed in the cluster
      # - name: ArgoCD sync
      #   uses: clowdhaus/argo-cd-action@v2.3.0
      #   with:
      #     command: app sync poc-app
      #     options: --prune --force
      #   env:
      #     ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
      #     ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
