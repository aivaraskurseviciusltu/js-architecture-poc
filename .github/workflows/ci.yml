name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ── Compute affected projects ────────────────────────────────────────────────
  setup:
    runs-on: ubuntu-24.04
    outputs:
      affected: ${{ steps.nx.outputs.affected }}
      head_sha: ${{ steps.shas.outputs.head }}
      base_sha: ${{ steps.shas.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute NX SHAs
        id: shas
        uses: nrwl/nx-set-shas@dbe0650947e5f2c81f59190a38512cf41fa2d61f  # v4.3.0

      - name: Compute affected projects
        id: nx
        run: |
          AFFECTED=$(npx nx show projects --affected --base=${{ steps.shas.outputs.base }} --head=${{ steps.shas.outputs.head }} --json 2>/dev/null || echo "[]")
          echo "affected=$AFFECTED" >> "$GITHUB_OUTPUT"

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    needs: setup
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint affected
        run: npx nx affected -t lint --base=${{ needs.setup.outputs.base_sha }} --head=${{ needs.setup.outputs.head_sha }}

  # ── Unit Tests ────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-24.04
    needs: setup
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test affected
        run: npx nx affected -t test --base=${{ needs.setup.outputs.base_sha }} --head=${{ needs.setup.outputs.head_sha }} --passWithNoTests

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build affected
        run: npx nx affected -t build --base=${{ needs.setup.outputs.base_sha }} --head=${{ needs.setup.outputs.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1

      - name: Build Docker images
        run: |
          for svc in order-service inventory-service notification-service; do
            docker build \
              -f apps/services/$svc/Dockerfile \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$svc:${{ github.sha }} \
              .
          done
          docker build \
            -f apps/bff/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/bff:${{ github.sha }} \
            .
          docker build \
            -f apps/frontend/Dockerfile \
            --build-arg VITE_BFF_URL=${{ vars.VITE_BFF_URL || 'http://localhost:3000' }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }} \
            .

      - name: Save images as artifacts
        run: |
          mkdir -p /tmp/images
          for img in order-service inventory-service notification-service bff frontend; do
            docker save ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$img:${{ github.sha }} \
              | gzip > /tmp/images/$img.tar.gz
          done

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: docker-images
          path: /tmp/images/
          retention-days: 1

  # ── Security Scan ────────────────────────────────────────────────────────────
  scan:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # npm audit — fail on high/critical
      - name: npm audit
        run: npm audit --audit-level=high

      # gitleaks — secret scanning
      - name: gitleaks
        uses: gitleaks/gitleaks-action@44c470f85fe29b4eb3a0ea1b40dd779e57f9d836  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Download images built in the build job
      - uses: actions/download-artifact@fa0a91b85d4f404e444306234f56e9a5c2e84cb0  # v4.1.8
        with:
          name: docker-images
          path: /tmp/images/

      - name: Load Docker images
        run: |
          for f in /tmp/images/*.tar.gz; do
            docker load < "$f"
          done

      # Trivy — image vulnerability scan (fail on HIGH/CRITICAL)
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/order-service:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@60168efe1c415ce0f5521ea06d5c2062adbeed1b  # v3.28.1
        with:
          sarif_file: trivy-results.sarif

      # Trivy SBOM generation
      - name: Generate SBOM (order-service)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/order-service:${{ github.sha }}
          format: spdx-json
          output: sbom-order-service.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: sbom
          path: sbom-*.spdx.json

      # Terraform security scan
      - name: tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6  # v1.0.3
        with:
          working_directory: infra/terraform

      - name: tflint
        uses: terraform-linters/setup-tflint@19a52fbac37dacb22a09518e4ef6ee234f2d4987  # v4.0.0
        with:
          tflint_version: v0.53.0
      - run: |
          cd infra/terraform
          tflint --init
          tflint --recursive

  # ── Push images to GHCR ──────────────────────────────────────────────────────
  push:
    runs-on: ubuntu-24.04
    needs: scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          for svc in order-service inventory-service notification-service; do
            docker buildx build \
              -f apps/services/$svc/Dockerfile \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$svc:${{ github.sha }} \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$svc:latest \
              --push \
              .
          done
          docker buildx build \
            -f apps/bff/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/bff:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/bff:latest \
            --push \
            .
          docker buildx build \
            -f apps/frontend/Dockerfile \
            --build-arg VITE_BFF_URL=${{ vars.VITE_BFF_URL || 'http://localhost:3000' }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest \
            --push \
            .
