name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# nx-set-shas needs actions:read to query workflow run history
permissions:
  contents: read
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ── Compute affected projects ────────────────────────────────────────────────
  setup:
    runs-on: ubuntu-24.04
    outputs:
      affected: ${{ steps.nx.outputs.affected }}
      head_sha: ${{ steps.shas.outputs.head }}
      base_sha: ${{ steps.shas.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute NX SHAs
        id: shas
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1  # v5.0.1

      - name: Compute affected projects
        id: nx
        run: |
          AFFECTED=$(npx nx show projects --affected --base=${{ steps.shas.outputs.base }} --head=${{ steps.shas.outputs.head }} --json 2>/dev/null || echo "[]")
          echo "affected=$AFFECTED" >> "$GITHUB_OUTPUT"

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    needs: setup
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint affected
        run: npx nx affected -t lint --base=${{ needs.setup.outputs.base_sha }} --head=${{ needs.setup.outputs.head_sha }}

  # ── Unit Tests ────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-24.04
    needs: setup
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test affected
        run: npx nx affected -t test --base=${{ needs.setup.outputs.base_sha }} --head=${{ needs.setup.outputs.head_sha }} --passWithNoTests

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build affected
        run: npx nx affected -t build --base=${{ needs.setup.outputs.base_sha }} --head=${{ needs.setup.outputs.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1

      - name: Build Docker images
        run: |
          for svc in order-service inventory-service notification-service; do
            docker build \
              -f apps/services/$svc/Dockerfile \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$svc:${{ github.sha }} \
              .
          done
          docker build \
            -f apps/bff/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/bff:${{ github.sha }} \
            .
          docker build \
            -f apps/frontend/Dockerfile \
            --build-arg VITE_BFF_URL=${{ vars.VITE_BFF_URL || 'http://localhost:3000' }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }} \
            .

      # No artifact upload — scan job rebuilds order-service directly.
      # Avoids storing large image tarballs in Actions storage.

  # ── Security Scan ────────────────────────────────────────────────────────────
  scan:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # npm audit — production dependencies only.
      # multer vulnerability is resolved via "overrides": {"multer": "2.3.0"} in package.json
      - name: npm audit (production only)
        run: npm audit --audit-level=high --omit=dev

      # gitleaks — secret scanning
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild order-service image for scanning — avoids downloading artifact from build job
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1

      - name: Build order-service image for scanning
        run: |
          docker build \
            --load \
            -f apps/services/order-service/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/order-service:${{ github.sha }} \
            .

      # Trivy — image vulnerability scan (fail on HIGH/CRITICAL)
      # Use table format for the blocking scan so exit-code works reliably,
      # then run a second pass for SBOM. SARIF upload requires GitHub Code
      # Scanning to be enabled; skip it to avoid failures on repos without it.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/order-service:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

      # Trivy SBOM generation (separate pass — never blocks the build)
      - name: Generate SBOM (order-service)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/order-service:${{ github.sha }}
          format: spdx-json
          output: sbom-order-service.spdx.json
          exit-code: '0'

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: sbom
          path: sbom-*.spdx.json
          if-no-files-found: ignore

      # Terraform security scan
      # Local equivalent (no Docker needed): tfsec infra/terraform
      - name: tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6  # v1.0.3
        with:
          working_directory: infra/terraform
          additional_args: --no-color

      - name: tflint
        uses: terraform-linters/setup-tflint@19a52fbac37dacb22a09518e4ef6ee234f2d4987  # v4.0.0
        with:
          tflint_version: v0.53.0
      - run: |
          cd infra/terraform
          tflint --init
          tflint --recursive

  # ── Push images to GHCR ──────────────────────────────────────────────────────
  push:
    runs-on: ubuntu-24.04
    needs: scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          for svc in order-service inventory-service notification-service; do
            docker buildx build \
              -f apps/services/$svc/Dockerfile \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$svc:${{ github.sha }} \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$svc:latest \
              --push \
              .
          done
          docker buildx build \
            -f apps/bff/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/bff:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/bff:latest \
            --push \
            .
          docker buildx build \
            -f apps/frontend/Dockerfile \
            --build-arg VITE_BFF_URL=${{ vars.VITE_BFF_URL || 'http://localhost:3000' }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest \
            --push \
            .
