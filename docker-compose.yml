services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-orders}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  order-service:
    build:
      context: .
      dockerfile: apps/services/order-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@mongodb:27017
      MONGODB_DB: ${MONGODB_DB:-orders}
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy

  bff:
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      ORDER_SERVICE_URL: http://order-service:3001
    ports:
      - "3000:3000"
    depends_on:
      - order-service

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_BFF_URL: ${VITE_BFF_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - bff

volumes:
  mongo_data:
