---
# Each service gets its own ServiceAccount with least-privilege.
# automountServiceAccountToken: false for services that do not call the K8s API.
#
# IRSA annotation: added per-service in the prod overlay via a strategic-merge patch
# so local k3d (which has no OIDC provider) is not affected.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: poc
  # annotations:
  #   eks.amazonaws.com/role-arn: <set by prod overlay patch>
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bff
  namespace: poc
  # annotations:
  #   eks.amazonaws.com/role-arn: <set by prod overlay patch>
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-service
  namespace: poc
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: poc
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: poc
automountServiceAccountToken: false
