---
# Each service gets its own ServiceAccount with least-privilege
# automountServiceAccountToken: false for services that do not call the K8s API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: poc
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bff
  namespace: poc
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-service
  namespace: poc
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  namespace: poc
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: poc
automountServiceAccountToken: false
