apiVersion: v1
kind: Namespace
metadata:
  name: poc
  labels:
    app.kubernetes.io/managed-by: kustomize
    # Pod Security Standards:
    # - baseline enforced (blocks host networking, privilege escalation, host PID/IPC)
    # - restricted only warned (MongoDB official image cannot satisfy restricted: runs as root)
    # App containers (NestJS) individually enforce restricted via their own securityContext.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
