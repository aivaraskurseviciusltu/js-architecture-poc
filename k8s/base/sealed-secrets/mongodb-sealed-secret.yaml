# SealedSecrets controller — install via Helm or kubectl
# Version pinned; update by re-running: kubeseal --fetch-cert
# Install: kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.1/controller.yaml
#
# Usage:
#   1. Create a plain Secret:
#      kubectl create secret generic mongodb-secret -n poc \
#        --from-literal=MONGO_ROOT_USER=root \
#        --from-literal=MONGO_ROOT_PASSWORD=changeme \
#        --from-literal=MONGODB_URI="mongodb://root:changeme@mongodb:27017" \
#        --dry-run=client -o yaml > /tmp/mongodb-secret.yaml
#
#   2. Seal it:
#      kubeseal --format yaml < /tmp/mongodb-secret.yaml > k8s/base/sealed-secrets/mongodb-sealed-secret.yaml
#
#   3. Commit the sealed secret (safe — encrypted with cluster public key)
#      rm /tmp/mongodb-secret.yaml   # never commit the plain version
#
# The sealed secret below is a PLACEHOLDER — replace with your real sealed output.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mongodb-secret
  namespace: poc
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    # Replace these with real values from: kubeseal --format yaml
    MONGO_ROOT_USER: REPLACE_WITH_KUBESEAL_OUTPUT
    MONGO_ROOT_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
    MONGODB_URI: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: mongodb-secret
      namespace: poc
    type: Opaque
