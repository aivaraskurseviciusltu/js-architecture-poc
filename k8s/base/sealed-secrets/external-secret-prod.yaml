# External Secrets Operator — pulls secrets from AWS Secrets Manager into k8s Secrets
# Install: helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#
# This file documents how to wire ESO for production (EKS + AWS Secrets Manager).
# The SecretStore uses IRSA — no AWS keys stored in the cluster.
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
# ExternalSecret — pulls DocumentDB credentials from Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mongodb-secret
  namespace: poc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: mongodb-secret
    creationPolicy: Owner
  data:
    - secretKey: MONGODB_URI
      remoteRef:
        key: js-fullstack-poc-prod/docdb/credentials
        property: connection_string
    - secretKey: MONGO_ROOT_USER
      remoteRef:
        key: js-fullstack-poc-prod/docdb/credentials
        property: username
    - secretKey: MONGO_ROOT_PASSWORD
      remoteRef:
        key: js-fullstack-poc-prod/docdb/credentials
        property: password
