# External Secrets Operator — pulls secrets from AWS Secrets Manager into k8s Secrets
# Install: helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#
# The ClusterSecretStore uses IRSA — no AWS access keys stored in the cluster.
# Region must match infra/terraform/environments/prod/terraform.tfvars (eu-north-1).
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
# ExternalSecret — pulls DocumentDB credentials from Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mongodb-secret
  namespace: poc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: mongodb-secret
    creationPolicy: Owner
  data:
    - secretKey: MONGODB_URI
      remoteRef:
        key: js-fullstack-poc-prod/docdb/credentials
        property: connection_string
    - secretKey: MONGO_ROOT_USER
      remoteRef:
        key: js-fullstack-poc-prod/docdb/credentials
        property: username
    - secretKey: MONGO_ROOT_PASSWORD
      remoteRef:
        key: js-fullstack-poc-prod/docdb/credentials
        property: password
---
# ExternalSecret — pulls BFF JWT signing key from Secrets Manager.
# Create the secret in AWS first:
#   aws secretsmanager create-secret \
#     --name js-fullstack-poc-prod/bff/jwt \
#     --secret-string '{"jwt_secret":"<random-256-bit-value>"}' \
#     --region eu-north-1
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bff-secret
  namespace: poc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: bff-secret
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: js-fullstack-poc-prod/bff/jwt
        property: jwt_secret
