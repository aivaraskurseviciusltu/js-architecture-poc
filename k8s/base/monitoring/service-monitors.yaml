apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bff
  namespace: poc
  labels:
    release: kube-prometheus-stack   # must match Prometheus operator's serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app: bff
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
