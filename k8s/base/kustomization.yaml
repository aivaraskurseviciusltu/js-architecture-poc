apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: poc

resources:
  - namespace.yaml
  - ingress.yaml
  - network-policies.yaml
  # Sealed Secrets — replaces plaintext mongodb/secret.yaml
  # Before first deploy: install the sealed-secrets controller and run kubeseal
  # See k8s/base/sealed-secrets/mongodb-sealed-secret.yaml for instructions
  - sealed-secrets/mongodb-sealed-secret.yaml
  # RBAC — ServiceAccounts, Roles, RoleBindings per service
  - rbac/service-accounts.yaml
  - rbac/roles.yaml
  - rbac/role-bindings.yaml
  # cert-manager — ClusterIssuer (local self-signed) + TLS certificate
  # Requires cert-manager to be installed first (see cluster-issuer.yaml comments)
  - cert-manager/cluster-issuer.yaml
  # MongoDB
  - mongodb/service.yaml
  - mongodb/statefulset.yaml
  # LocalStack
  - localstack/configmap.yaml
  - localstack/service.yaml
  - localstack/deployment.yaml
  # Order Service
  - order-service/configmap.yaml
  - order-service/service.yaml
  - order-service/deployment.yaml
  - order-service/hpa.yaml
  # BFF
  - bff/configmap.yaml
  - bff/service.yaml
  - bff/deployment.yaml
  - bff/hpa.yaml
  # Inventory Service
  - inventory-service/configmap.yaml
  - inventory-service/service.yaml
  - inventory-service/deployment.yaml
  # Notification Service
  - notification-service/configmap.yaml
  - notification-service/service.yaml
  - notification-service/deployment.yaml
  # Frontend
  - frontend/service.yaml
  - frontend/deployment.yaml
