apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: poc

resources:
  - namespace.yaml
  - ingress.yaml
  - network-policies.yaml
  # MongoDB plaintext secret for local k3d only.
  # Production: replace with sealed-secrets/mongodb-sealed-secret.yaml
  # and install the sealed-secrets controller first.
  - mongodb/secret.yaml
  # RBAC — ServiceAccounts, Roles, RoleBindings per service
  - rbac/service-accounts.yaml
  - rbac/roles.yaml
  - rbac/role-bindings.yaml
  # MongoDB
  - mongodb/service.yaml
  - mongodb/statefulset.yaml
  # LocalStack
  - localstack/configmap.yaml
  - localstack/service.yaml
  - localstack/deployment.yaml
  # Order Service
  - order-service/configmap.yaml
  - order-service/service.yaml
  - order-service/deployment.yaml
  - order-service/hpa.yaml
  # BFF
  - bff/configmap.yaml
  # Dev-only placeholder Secret for local k3d. Production: ESO creates bff-secret from Secrets Manager.
  - bff/secret.yaml
  - bff/service.yaml
  - bff/deployment.yaml
  - bff/hpa.yaml
  # Inventory Service
  - inventory-service/configmap.yaml
  - inventory-service/service.yaml
  - inventory-service/deployment.yaml
  # Notification Service
  - notification-service/configmap.yaml
  - notification-service/service.yaml
  - notification-service/deployment.yaml
  # Frontend
  - frontend/service.yaml
  - frontend/deployment.yaml

  # ── The resources below require additional controllers ────────────────────────
  # Uncomment AFTER installing the required controller:
  #
  # Sealed Secrets (install first: helm install sealed-secrets ...):
  #   - sealed-secrets/mongodb-sealed-secret.yaml
  #
  # cert-manager (install first: helm install cert-manager ...):
  #   - cert-manager/cluster-issuer.yaml
